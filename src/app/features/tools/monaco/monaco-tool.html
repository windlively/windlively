<app-tool-head toolId="monaco" />

<div class="glass body">
  <div class="toolbar">
    <label class="field">
      <span class="subtle">语言</span>
      <select [value]="language()" (change)="onLanguage($event)" aria-label="语言">
        @for (l of languages(); track l.id) {
          <option [value]="l.id" [selected]="l.id === language()">{{ l.label }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="subtle">主题</span>
      <select [value]="theme()" (change)="onTheme($event)" aria-label="主题">
        @for (t of themes; track t.id) {
          <option [value]="t.id" [selected]="t.id === theme()">{{ t.label }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="subtle">字号</span>
      <input
        type="number"
        min="10"
        max="28"
        [value]="fontSize()"
        (input)="onFontSize($event)"
        aria-label="字号"
      />
    </label>
    <button type="button" class="btn btn-sm" [class.wrap-on]="wordWrap()" (click)="toggleWrap()">
      自动换行
    </button>
    <span class="spacer"></span>
    <app-copy-button [text]="content()" label="复制" />
    <button type="button" class="btn btn-sm" (click)="exportFile()">
      <app-icon name="download" [size]="15" /> 导出
    </button>
    <button type="button" class="btn btn-sm" (click)="reset()">重置</button>
    <button type="button" class="btn btn-sm" (click)="clear()">清空</button>
  </div>

  <div class="editor-wrap">
    <div #host class="host"></div>
    @if (loading()) {
      <div class="overlay">
        <span class="ring spin"></span>
        编辑器加载中……
      </div>
    }
    @if (failed()) {
      <div class="overlay">
        <p>编辑器资源加载失败：请确认 public/monaco 存在（重新执行 npm install 可自动同步）</p>
        <button type="button" class="btn btn-sm" (click)="init()">重试</button>
      </div>
    }
  </div>

  <footer class="status mono subtle">
    <span>{{ language() }}</span>
    <span>Ln {{ cursor() }}</span>
    <span>{{ content().length }} 字符</span>
  </footer>
</div>
